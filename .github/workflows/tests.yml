name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['10', '11', '12']
        include:
          - laravel: '10'
            testbench: '^8.0'
            pest: '^2.0'
          - laravel: '11'
            testbench: '^9.0'
            pest: '^3.0'
          - laravel: '12'
            testbench: '^10.0'
            pest: '^3.0'

    # RedisSessionStoreIntegrationTest skips itself without a server
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: soap, dom, libxml, redis
          coverage: none

      # A library's lock only pins its own dev tooling: resolve fresh for each
      # Laravel version instead.
      - name: Install dependencies
        run: >-
          composer update
          --with "orchestra/testbench:${{ matrix.testbench }}"
          --with "pestphp/pest:${{ matrix.pest }}"
          --with-all-dependencies
          --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
